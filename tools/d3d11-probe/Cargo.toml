[package]
name = "d3d11-probe"
description = "Prototype: the same scene workload on Direct3D 11 and on Vulkan (wgpu), with every metric measured."
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Not a member of the root workspace (it has its own, empty one): the root Cargo.toml and
# Cargo.lock are untouched. The Cargo.lock next to this file started as a copy of the root's, so
# every dependency is at the version the real build uses.
[workspace]

[dependencies]
lumenwall-assets = { path = "../../crates/lumenwall-assets" }
lumenwall-formats = { path = "../../crates/lumenwall-formats" }
lumenwall-scene = { path = "../../crates/lumenwall-scene" }
lumenwall-shader = { path = "../../crates/lumenwall-shader" }
naga = { version = "30.0.1", features = ["hlsl-out"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "naga-ir"] }
raw-window-handle = "0.6.2"
pollster = "0.4"
anyhow = "1"
blake3 = "1.8"
bytemuck = "1.25"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
debug = 1
