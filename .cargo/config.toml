# Workspace Cargo settings. Deliberately empty of active settings: everything here
# applies to every build (local, CI, release), and any change to rustflags rebuilds
# the whole dependency tree. Release tuning lives in [profile.release] (Cargo.toml).

# --- CPU baseline -------------------------------------------------------------------
# The release binary is distributed to customers: never use `target-cpu=native`. It
# emits whatever the build machine has (AVX2, AVX-512...) and the binary then dies with
# SIGILL / STATUS_ILLEGAL_INSTRUCTION on older CPUs.
#
# Candidate, NOT enabled: x86-64-v2 (SSE3, SSSE3, SSE4.1, SSE4.2, POPCNT, CMPXCHG16B).
# - Present on every x86-64 CPU since ~2009 (Intel Nehalem, AMD Bulldozer). Windows 11
#   24H2 already refuses to boot without SSE4.2 + POPCNT; RHEL 9 requires x86-64-v2.
# - Expected gain is small: rendering runs on the GPU, and the CPU-heavy dependencies
#   (rustfft/realfft, zune-jpeg) already pick SSE4.1/AVX/AVX2 paths at runtime. glam has
#   no SSE4-specific code; the compiler may still use SSE4.1 (roundps, blendvps...) in
#   particle and parsing loops.
# - Enable only after a criterion benchmark or a frame-time capture shows a measurable
#   gain (docs/PERFORMANCE.md), and then state the CPU requirement in the product's
#   system requirements.
#
# [target.x86_64-unknown-linux-gnu]
# rustflags = ["-C", "target-cpu=x86-64-v2"]
#
# [target.x86_64-pc-windows-msvc]
# rustflags = ["-C", "target-cpu=x86-64-v2"]

# --- Windows C runtime --------------------------------------------------------------
# Decided (November 2026): the Windows RELEASE programs link the C runtime statically.
# .github/workflows/release.yml sets CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS to
# `-C target-feature=+crt-static -D linker-messages` for its builds; it is NOT set here,
# where it would apply to every dev, test and CI build and rebuild every tree. Why: a
# fresh Windows (Windows Sandbox) has no VC++ redistributable, so programs importing
# vcruntime140.dll do not start at all, and the per-user installer cannot install it
# (no admin rights). Why it is safe:
# - One runtime per program: cc builds the C code of build scripts (QuickJS, ring,
#   blake3, psm, stacker) with /MT once crt-static is on, cef-dll-sys builds CEF's C++
#   wrapper with /MT in every build, and `-D linker-messages` fails the link on any
#   linker warning, LNK4098 (mixed /MD and /MT objects) included.
# - Nothing crosses a C runtime: libcef.dll has its own and FFmpeg's DLLs use msvcrt.dll
#   (mingw-w64), but CEF strings, lists and maps are allocated and freed by libcef's
#   functions (the cef crate), FFmpeg's buffers by av_malloc/av_freep and its objects by
#   their own *_free functions; Rust's allocator is the process heap, not the CRT's.
# package.py refuses a Windows zip whose programs or DLLs import the redistributable.
# Local release builds: docs/RELEASING.md ("Trying it without publishing").
