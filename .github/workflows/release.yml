# Lumenwall releases. Push a tag v<version> (the [workspace.package] version of
# Cargo.toml): Linux and Windows archives, the Debian package and the Windows installer
# (Lumenwall-Setup.exe) are built, install.sh is added, SHA256SUMS lists them all and is
# the one file signed with the minisign release key (SHA256SUMS.minisig), checked
# exactly as the app checks updates (and the one-line installer is tried on the signed
# files), and the GitHub release is published: a download section
# (packaging/release/release-notes.md), then the generated notes.
# Published files, nothing else: Lumenwall-Setup.exe, lumenwall-<v>-x86_64-pc-windows-msvc.zip,
# lumenwall-<v>-x86_64-unknown-linux-gnu.tar.gz, lumenwall-<v>-amd64.deb, install.sh,
# SHA256SUMS, SHA256SUMS.minisig.
# The Windows zip (and the installer made from it) also ships FFmpeg's LGPL DLLs (video
# wallpapers; Lumenwall's minimal build, packaging/ffmpeg/build.sh, made by the `ffmpeg`
# job) and lumenwall-web-host.exe with the CEF runtime (web wallpapers):
# packaging/release/windows-runtime.toml lists them.
# Procedure, key creation and checks: docs/RELEASING.md.
# Third-party actions are pinned to a commit SHA (tag in the trailing comment).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # Authenticode code signing of the Windows programs and installer, not set up yet
  # (docs/RELEASING.md#authenticode-signing). "true" once the AUTHENTICODE_TOKEN
  # secret exists; until then the two steps marked "AUTHENTICODE" are skipped. Only
  # whether the secret exists is read here, never its value.
  AUTHENTICODE: ${{ secrets.AUTHENTICODE_TOKEN != '' }}

defaults:
  run:
    shell: bash

jobs:
  version:
    name: check the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ "$TAG" != v* || ! "$version" =~ $semver ]]; then
            echo "::error::$TAG is not v<semver> (v0.2.0, v0.3.0-beta.1)"
            exit 1
          fi
          manifest=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [[ "$manifest" != "$version" ]]; then
            echo "::error::the tag is $TAG but Cargo.toml says $manifest: bump [workspace.package] version first"
            exit 1
          fi
          # Fail in seconds rather than after the builds (release_sign checks it for real).
          if grep -Eq 'RELEASE_PUBLIC_KEY: Option<&str> = None;' crates/lumenwall-update/src/lib.rs; then
            echo "::error::RELEASE_PUBLIC_KEY is not set: this release could not verify its own updates (docs/RELEASING.md)"
            exit 1
          fi
          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  # Lumenwall's FFmpeg for Windows (packaging/ffmpeg/build.sh, packaging/ffmpeg/README.md):
  # FFmpeg's release tarball and two header packages, each checked against its SHA-256,
  # cross-compiled with mingw-w64 on the same image as CI's `ffmpeg` job. No cache: like
  # the programs, a release's DLLs are built from this commit's sources.
  ffmpeg:
    name: FFmpeg (Windows DLLs)
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            gcc-mingw-w64-x86-64-win32 binutils-mingw-w64-x86-64 mingw-w64-x86-64-dev nasm make pkg-config
          packaging/ffmpeg/build.sh "$RUNNER_TEMP/ffmpeg-win64"
          du -cb "$RUNNER_TEMP"/ffmpeg-win64/bin/*.dll
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffmpeg-win64
          path: ${{ runner.temp }}/ffmpeg-win64
          if-no-files-found: error
          retention-days: 7

  build:
    name: build (${{ matrix.target }})
    needs: [version, ffmpeg]
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - name: Check out with LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          # No cache: a release is built from this commit and crates.io only.
          cache: "false"
          # Windows: Lumenwall's FFmpeg build from the `ffmpeg` job (FFMPEG_DIR,
          # LIBCLANG_PATH), for video wallpapers. No effect on Linux (system FFmpeg).
          ffmpeg: "true"
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-about@0.9.3

      # Windows: cl.exe hits MAX_PATH on CEF's C++ wrapper under a deep target folder
      # (crates/lumenwall-web/README.md), so Cargo builds in a short one; the cef crate
      # downloads CEF's distribution into CEF_PATH. BIN_DIR: where the programs land.
      - name: Folders
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            temp=$(cygpath -m "$RUNNER_TEMP")
            {
              echo "CARGO_TARGET_DIR=$temp/t"
              echo "CEF_PATH=$temp/cef"
              echo "BIN_DIR=$temp/t/$TARGET/release"
            } >> "$GITHUB_ENV"
          else
            echo "BIN_DIR=target/$TARGET/release" >> "$GITHUB_ENV"
          fi

      # Windows: with FFmpeg (video wallpapers). The DLLs are not imported by
      # lumenwall.exe but loaded from its folder at the first video; package.py ships
      # them (crates/lumenwall-video/README.md, "Windows distribution"). Linux enables
      # FFmpeg by itself.
      - name: Build
        run: |
          features=()
          if [[ "$RUNNER_OS" == Windows ]]; then
            features=(--features lumenwall-engine/video-ffmpeg)
          fi
          cargo build --workspace --release --locked --target "$TARGET" "${features[@]}"

      # Web wallpapers: lumenwall-web-host with CEF, in a build of its own so that the
      # cef feature never reaches lumenwall.exe. The cef crate downloads CEF's windows64
      # minimal distribution (175 MB, official CEF builds) and builds CEF's C++ wrapper
      # with CMake and Ninja: both need the MSVC environment (vcvars64.bat).
      - name: Build the web host (Windows, CEF)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'no Visual Studio with the C++ tools' }
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { [Environment]::SetEnvironmentVariable($Matches[1], $Matches[2]) }
          }
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            $env:PATH = "$vs\Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja;$env:PATH"
          }
          "ninja $(ninja --version), $((Get-Command cl).Source)"
          cargo build --release --locked --target $env:TARGET -p lumenwall-web --features cef --bin lumenwall-web-host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The distribution the cef crate extracted: package.py takes the runtime files
          # (windows-runtime.toml) from there, and its archive for CEF's licence.
          $cef = @(Get-ChildItem -Directory "$env:CEF_PATH\*\cef_windows_x86_64")
          if ($cef.Count -ne 1) { throw "expected one CEF distribution in $env:CEF_PATH, found $($cef.Count)" }
          "CEF_RUNTIME=$($cef[0].FullName -replace '\\', '/')" >> $env:GITHUB_ENV

      # ---- AUTHENTICODE (1/2): plug the code-signing service in here ----------------
      # Signs in place, before package.py zips them: the zip, the installer made from
      # it and SHA256SUMS then all carry the signed files. Our three programs, and the
      # third-party DLLs that ship unsigned (FFmpeg's, CEF's); d3dcompiler_47.dll keeps
      # Microsoft's signature. Skipped until the AUTHENTICODE_TOKEN secret exists
      # (env.AUTHENTICODE above); fails while it exists but no signing command replaces
      # this placeholder, so a release is never published unsigned by mistake.
      # docs/RELEASING.md#authenticode-signing
      - name: "AUTHENTICODE: sign the programs and the unsigned DLLs"
        if: runner.os == 'Windows' && env.AUTHENTICODE == 'true'
        env:
          FILES: >-
            ${{ env.BIN_DIR }}/lumenwall.exe ${{ env.BIN_DIR }}/lumenwall-ui.exe
            ${{ env.BIN_DIR }}/lumenwall-web-host.exe
            ${{ env.FFMPEG_DIR }}/bin/avutil-60.dll ${{ env.FFMPEG_DIR }}/bin/swresample-6.dll
            ${{ env.FFMPEG_DIR }}/bin/swscale-9.dll ${{ env.FFMPEG_DIR }}/bin/avcodec-62.dll
            ${{ env.FFMPEG_DIR }}/bin/avformat-62.dll
            ${{ env.CEF_RUNTIME }}/libcef.dll ${{ env.CEF_RUNTIME }}/chrome_elf.dll
            ${{ env.CEF_RUNTIME }}/vk_swiftshader.dll ${{ env.CEF_RUNTIME }}/vulkan-1.dll
        run: |
          echo "::error::AUTHENTICODE_TOKEN is set but no signing command is plugged in for: $FILES (docs/RELEASING.md#authenticode-signing)"
          exit 1

      # Windows: with the features of what ships (ffmpeg-sys-next, the cef crates).
      # package.py adds FFmpeg's and CEF's own notices to this file.
      - name: Third-party notices
        run: |
          features=()
          if [[ "$RUNNER_OS" == Windows ]]; then
            features=(--features "lumenwall-engine/video-ffmpeg lumenwall-web/cef")
          fi
          cargo about generate --workspace --locked --fail "${features[@]}" \
            -c packaging/about/about.toml packaging/about/about.hbs \
            -o "$RUNNER_TEMP/THIRD-PARTY-NOTICES.html"

      # Windows: also FFmpeg's DLLs and the CEF runtime, exactly the files of
      # packaging/release/windows-runtime.toml, with their licences; package.py then
      # checks the zip holds exactly the files of a release.
      - name: Package
        run: |
          py=python3
          runtime=()
          if [[ "$RUNNER_OS" == Windows ]]; then
            py=python
            runtime=(--ffmpeg-dir "$FFMPEG_DIR" --web-runtime "$CEF_RUNTIME")
          fi
          # Same inputs, same archive: timestamps come from the tagged commit.
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          "$py" packaging/release/package.py \
            --version "$VERSION" --target "$TARGET" \
            --bin-dir "$BIN_DIR" \
            --notices "$RUNNER_TEMP/THIRD-PARTY-NOTICES.html" \
            --out dist "${runtime[@]}"
          ls -l dist

      # System-wide package: /usr/bin, /usr/share; Depends from dpkg-shlibdeps,
      # FFmpeg Recommends from the headers the engine was built with (pkg-config).
      - name: Debian package
        if: runner.os == 'Linux'
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          python3 packaging/release/deb.py \
            --version "$VERSION" \
            --bin-dir "$BIN_DIR" \
            --notices "$RUNNER_TEMP/THIRD-PARTY-NOTICES.html" \
            --out dist
          dpkg-deb --info "dist/lumenwall-$VERSION-amd64.deb"
          dpkg-deb --contents "dist/lumenwall-$VERSION-amd64.deb"

      # Published as releases/latest/download/install.sh (added in "sign and publish").
      - name: Check the one-line installer
        if: runner.os == 'Linux'
        run: |
          if ! command -v shellcheck; then
            sudo apt-get update -q
            sudo apt-get install -y -q --no-install-recommends shellcheck
          fi
          shellcheck --shell=sh --severity=warning packaging/linux/install.sh packaging/windows/build-installer.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: dist/lumenwall-*
          if-no-files-found: error
          retention-days: 7

  # NSIS (zlib licence) runs on Linux: the installer is made from the Windows zip
  # itself, so it holds exactly the files the archive and the updater have. Solid LZMA
  # over ≈ 448 MB (FFmpeg and CEF included) takes a few minutes.
  installer:
    name: windows installer
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-x86_64-pc-windows-msvc
          path: windows
      - name: Install NSIS
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends nsis p7zip-full
          makensis -VERSION
      # Writes dist/Lumenwall-Setup.exe (same name in every release, so
      # releases/latest/download/Lumenwall-Setup.exe always works). Fails on any
      # makensis error, then checks the programs are inside (7z).
      - name: Build the installer
        run: |
          packaging/windows/build-installer.sh "$VERSION" \
            "windows/lumenwall-$VERSION-x86_64-pc-windows-msvc.zip" dist
          test -s dist/Lumenwall-Setup.exe
      # ---- AUTHENTICODE (2/2): plug the code-signing service in here ----------------
      # Signs the installer once it is built, before the "sign and publish" job
      # computes SHA256SUMS. Skipped and guarded like step 1/2 (build job).
      # docs/RELEASING.md#authenticode-signing
      - name: "AUTHENTICODE: sign Lumenwall-Setup.exe"
        if: env.AUTHENTICODE == 'true'
        env:
          FILES: dist/Lumenwall-Setup.exe
        run: |
          echo "::error::AUTHENTICODE_TOKEN is set but no signing command is plugged in for: $FILES (docs/RELEASING.md#authenticode-signing)"
          exit 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows-installer
          path: dist/Lumenwall-Setup.exe
          if-no-files-found: error
          retention-days: 7

  publish:
    name: sign and publish
    needs: [version, build, installer]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The only job that can write to the repository (create the release).
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          system-deps: "false"
          cache: "false"

      # Built before any secret is in the environment; Cargo.lock pins the minisign crate.
      - name: Build the signing tool
        run: cargo build --locked -p lumenwall-update --example release_sign

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      # The same script in every release: releases/latest/download/install.sh.
      - name: Add the one-line installer
        run: cp packaging/linux/install.sh dist/install.sh

      # Writes SHA256SUMS (every file in dist) and SHA256SUMS.minisig, the release's
      # only signature; refuses any other .minisig. Everything Windows that gets an
      # Authenticode signature is signed before this point (AUTHENTICODE 1/2, 2/2).
      - name: Sign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: target/debug/examples/release_sign sign --version "$VERSION" dist

      - name: Verify as the app does
        run: |
          target/debug/examples/release_sign verify --version "$VERSION" dist
          (cd dist && sha256sum --check --strict SHA256SUMS)
          # The Windows zip (and so the installer made from it) holds exactly a release's
          # files: the programs, FFmpeg's DLLs, the CEF runtime with every locale, their
          # licences and notices (packaging/release/windows-runtime.toml), nothing else.
          python3 packaging/release/package.py --check "dist/lumenwall-$VERSION-x86_64-pc-windows-msvc.zip"
          # Exactly these files are published, and SHA256SUMS lists exactly them.
          files=(
            Lumenwall-Setup.exe
            "lumenwall-$VERSION-x86_64-pc-windows-msvc.zip"
            "lumenwall-$VERSION-x86_64-unknown-linux-gnu.tar.gz"
            "lumenwall-$VERSION-amd64.deb"
            install.sh
          )
          printf '%s\n' "${files[@]}" | LC_ALL=C sort > "$RUNNER_TEMP/want-listed"
          printf '%s\n' "${files[@]}" SHA256SUMS SHA256SUMS.minisig | LC_ALL=C sort > "$RUNNER_TEMP/want-published"
          awk '{ print $2 }' dist/SHA256SUMS | LC_ALL=C sort > "$RUNNER_TEMP/listed"
          (cd dist && ls -A) | LC_ALL=C sort > "$RUNNER_TEMP/published"
          if ! diff -u "$RUNNER_TEMP/want-listed" "$RUNNER_TEMP/listed"; then
            echo "::error::SHA256SUMS does not list exactly the release files (diff above)"
            exit 1
          fi
          if ! diff -u "$RUNNER_TEMP/want-published" "$RUNNER_TEMP/published"; then
            echo "::error::dist does not hold exactly the files to publish (diff above)"
            exit 1
          fi
          ls -l dist

      # What `curl -fsSL .../install.sh | sh` does, on these signed files (served
      # from disk), in a throw-away home: download, SHA256SUMS.minisig, checksum,
      # install, uninstall; and a SHA256SUMS changed after signing is refused.
      - name: Try the one-line installer
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends minisign
          serve() { # folder holding the release files -> releases URL
            mkdir -p "$RUNNER_TEMP/$2/latest" "$RUNNER_TEMP/$2/download"
            ln -s "$1" "$RUNNER_TEMP/$2/latest/download"
            ln -s "$1" "$RUNNER_TEMP/$2/download/v$VERSION"
            echo "file://$RUNNER_TEMP/$2"
          }
          home=$(mktemp -d)
          run() {
            env -i HOME="$home" PATH=/usr/bin:/bin XDG_CURRENT_DESKTOP=none \
              LUMENWALL_RELEASES_URL="$url" sh dist/install.sh "$@"
          }
          cp -R dist "$RUNNER_TEMP/tampered"
          printf '\n' >> "$RUNNER_TEMP/tampered/SHA256SUMS"
          url=$(serve "$RUNNER_TEMP/tampered" tampered-releases)
          if run --require-signature; then
            echo "::error::install.sh accepted a SHA256SUMS that does not match SHA256SUMS.minisig"
            exit 1
          fi
          test ! -e "$home/.local/bin/lumenwall-ui"
          url=$(serve "$PWD/dist" releases)
          run --require-signature
          test -x "$home/.local/bin/lumenwall" && test -x "$home/.local/bin/lumenwall-ui"
          grep -q "^Exec=\"$home/.local/bin/lumenwall-ui\"" "$home/.local/share/applications/lumenwall-ui.desktop"
          grep -q "^Exec=\"$home/.local/bin/lumenwall-ui\" --background" "$home/.config/autostart/lumenwall.desktop"
          test -f "$home/.local/share/icons/hicolor/scalable/apps/lumenwall.svg"
          run --uninstall
          test ! -e "$home/.local/bin/lumenwall-ui" && test ! -e "$home/.config/autostart/lumenwall.desktop"

      # Notes: the download section (packaging/release/release-notes.md, the app's
      # update panel skips it), then GitHub's generated notes: with --generate-notes,
      # the API appends them to the given body.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          { sed "s/@VERSION@/$VERSION/g" packaging/release/release-notes.md; echo; } > "$notes"
          if grep -q '@VERSION@' "$notes" || ! grep -q "download/v$VERSION/Lumenwall-Setup.exe" "$notes"; then
            echo "::error::packaging/release/release-notes.md was not filled in"
            exit 1
          fi
          flags=(--verify-tag --generate-notes --notes-file "$notes" --title "Lumenwall $VERSION" --draft)
          if [[ "$PRERELEASE" == true ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" "${flags[@]}" dist/*
          # Public only once every file is uploaded: the app never sees half a release.
          if [[ "$PRERELEASE" == true ]]; then
            gh release edit "$TAG" --draft=false
          else
            gh release edit "$TAG" --draft=false --latest
          fi
