# Lumenwall CI. What each job does and how to run the same checks locally: docs/CI.md.
# Third-party actions are pinned to a commit SHA (tag in the trailing comment).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly: new RustSec advisories and new stable clippy lints show up without a push.
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

defaults:
  run:
    shell: bash

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          system-deps: "false"
          cache: "false"
      - run: cargo fmt --all --check

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          system-deps: "false"
          cache: "false"
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-deny@0.20.2
      - name: Advisories (RustSec)
        run: cargo deny --locked check advisories
      - name: Licences, bans, sources
        if: ${{ !cancelled() }}
        run: cargo deny --locked check bans licenses sources

  clippy:
    name: clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Check out with LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Check out with LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          software-gpu: "true"

      - name: Tests (default features)
        run: cargo test --workspace --locked

      # GPU tests are #[ignore] with "gpu" in their path; see docs/CI.md.
      - name: Select software GPU (Mesa lavapipe)
        if: runner.os == 'Linux'
        run: |
          # lvp_icd.x86_64.json on Ubuntu 24.04, lvp_icd.json on 26.04.
          shopt -s nullglob
          icds=(/usr/share/vulkan/icd.d/lvp_icd*.json)
          if (( ${#icds[@]} == 0 )); then
            echo "::error::Mesa lavapipe ICD not found in /usr/share/vulkan/icd.d"
            exit 1
          fi
          icd=${icds[0]}
          {
            echo "VK_DRIVER_FILES=$icd"
            echo "WGPU_BACKEND=vulkan"
            echo "WGPU_ADAPTER_NAME=llvmpipe"
          } >> "$GITHUB_ENV"
          VK_DRIVER_FILES="$icd" vulkaninfo --summary
      - name: Select software GPU (WARP)
        if: runner.os == 'Windows'
        run: |
          {
            echo "WGPU_BACKEND=dx12"
            echo "WGPU_ADAPTER_NAME=Microsoft Basic Render Driver"
          } >> "$GITHUB_ENV"
      - name: GPU tests (software adapter)
        env:
          LUMENWALL_GPU_TESTS: "1"
        run: cargo test --workspace --locked -- --ignored gpu

  # Video wallpapers on Windows. `lumenwall-engine/video-ffmpeg` is off by default there
  # (ffmpeg-sys-next needs FFmpeg's headers and import libraries to build); release builds
  # turn it on. The DLLs are loaded at the first video, so the executable must start
  # without them.
  video-windows:
    name: video (Windows, FFmpeg)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      FEATURES: lumenwall-engine/video-ffmpeg,lumenwall-video/ffmpeg
    steps:
      - name: Check out with LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          ffmpeg: "true"
      - name: Clippy with FFmpeg
        run: cargo clippy --workspace --all-targets --locked --features "$FEATURES" -- -D warnings
      - name: Tests with FFmpeg
        run: cargo test -p lumenwall-video -p lumenwall-engine --locked --features "$FEATURES"
      - name: lumenwall.exe starts without the FFmpeg DLLs
        run: |
          cargo build -p lumenwall --locked --features lumenwall-engine/video-ffmpeg
          # Only the Windows folders on PATH: an import entry on an FFmpeg DLL would make
          # the loader refuse to start the executable.
          PATH="$(cygpath -u "$SYSTEMROOT")/System32:$(cygpath -u "$SYSTEMROOT")" \
            target/debug/lumenwall.exe --version
      - name: Decode a generated H.264 clip on WARP
        env:
          WGPU_BACKEND: dx12
          LUMENWALL_FFMPEG_LOG: warning
        run: |
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=1280x720:rate=30 \
            -t 2 -c:v libopenh264 -pix_fmt yuv420p "$RUNNER_TEMP/clip.mp4"
          cargo run -p lumenwall-video --locked --features ffmpeg --example video_png -- \
            --times 0,1.5 --out "$RUNNER_TEMP/shots" "$RUNNER_TEMP/clip.mp4"
          ls -l "$RUNNER_TEMP/shots"

  release:
    name: release build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Check out with LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - run: cargo build --workspace --release --locked
      # Private artifact (repository members only) for manual testing on a real desktop.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lumenwall-${{ runner.os }}-${{ github.sha }}
          path: |
            target/release/lumenwall
            target/release/lumenwall.exe
          if-no-files-found: error
          retention-days: 7
