# Lumenwall CI. What each job does and how to run the same checks locally: docs/CI.md.
# Third-party actions are pinned to a commit SHA (tag in the trailing comment).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly: new RustSec advisories and new stable clippy lints show up without a push.
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

defaults:
  run:
    shell: bash

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          system-deps: "false"
          cache: "false"
      - run: cargo fmt --all --check

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          system-deps: "false"
          cache: "false"
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-deny@0.20.2
      - name: Advisories (RustSec)
        run: cargo deny --locked check advisories
      - name: Licences, bans, sources
        if: ${{ !cancelled() }}
        run: cargo deny --locked check bans licenses sources

  clippy:
    name: clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Check out with LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Check out with LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          software-gpu: "true"

      - name: Tests (default features)
        run: cargo test --workspace --locked

      # GPU tests are #[ignore] with "gpu" in their path; see docs/CI.md.
      - name: Select software GPU (Mesa lavapipe)
        if: runner.os == 'Linux'
        run: |
          # lvp_icd.x86_64.json on Ubuntu 24.04, lvp_icd.json on 26.04.
          shopt -s nullglob
          icds=(/usr/share/vulkan/icd.d/lvp_icd*.json)
          if (( ${#icds[@]} == 0 )); then
            echo "::error::Mesa lavapipe ICD not found in /usr/share/vulkan/icd.d"
            exit 1
          fi
          icd=${icds[0]}
          {
            echo "VK_DRIVER_FILES=$icd"
            echo "WGPU_BACKEND=vulkan"
            echo "WGPU_ADAPTER_NAME=llvmpipe"
          } >> "$GITHUB_ENV"
          VK_DRIVER_FILES="$icd" vulkaninfo --summary
      - name: Select software GPU (WARP)
        if: runner.os == 'Windows'
        run: |
          {
            echo "WGPU_BACKEND=dx12"
            echo "WGPU_ADAPTER_NAME=Microsoft Basic Render Driver"
          } >> "$GITHUB_ENV"
      - name: GPU tests (software adapter)
        env:
          LUMENWALL_GPU_TESTS: "1"
        run: cargo test --workspace --locked -- --ignored gpu

  # Lumenwall's FFmpeg for Windows (packaging/ffmpeg/build.sh): cross-compiled with
  # mingw-w64, cached by the script (which pins the sources) and the runner image (which
  # fixes the toolchain), handed to the Windows video job as the `ffmpeg-win64` artifact
  # (the setup action's `ffmpeg` input), with generated clips to decode.
  ffmpeg:
    name: FFmpeg (Windows DLLs)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache key
        id: key
        run: echo "key=ffmpeg-win64-$ImageOS-$ImageVersion-${{ hashFiles('packaging/ffmpeg/build.sh') }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: ${{ runner.temp }}/ffmpeg-win64
          key: ${{ steps.key.outputs.key }}
      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            gcc-mingw-w64-x86-64-win32 binutils-mingw-w64-x86-64 mingw-w64-x86-64-dev nasm make pkg-config
          packaging/ffmpeg/build.sh "$RUNNER_TEMP/ffmpeg-win64"
      - name: Size
        run: |
          cat "$RUNNER_TEMP/ffmpeg-win64/BUILD-INFO.txt"
          du -cb "$RUNNER_TEMP"/ffmpeg-win64/bin/*.dll
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffmpeg-win64
          path: ${{ runner.temp }}/ffmpeg-win64
          if-no-files-found: error
          retention-days: 7
      - name: Test clips
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ffmpeg
          packaging/ffmpeg/test-clips.sh "$RUNNER_TEMP/clips"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffmpeg-test-clips
          path: ${{ runner.temp }}/clips
          if-no-files-found: error
          retention-days: 7

  # Video wallpapers on Windows. `lumenwall-engine/video-ffmpeg` is off by default there
  # (ffmpeg-sys-next needs FFmpeg's headers and import libraries to build); release builds
  # turn it on. The DLLs are loaded at the first video, so the executable must start
  # without them.
  video-windows:
    name: video (Windows, FFmpeg)
    needs: ffmpeg
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      FEATURES: lumenwall-engine/video-ffmpeg,lumenwall-video/ffmpeg
    steps:
      - name: Check out with LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          # Lumenwall's FFmpeg build, from the `ffmpeg` job above.
          ffmpeg: "true"
      - name: Clippy with FFmpeg
        run: cargo clippy --workspace --all-targets --locked --features "$FEATURES" -- -D warnings
      - name: Tests with FFmpeg
        run: cargo test -p lumenwall-video -p lumenwall-engine --locked --features "$FEATURES"
      - name: lumenwall.exe starts without the FFmpeg DLLs
        run: |
          cargo build -p lumenwall --locked --features lumenwall-engine/video-ffmpeg
          # Only the Windows folders on PATH: an import entry on an FFmpeg DLL would make
          # the loader refuse to start the executable.
          PATH="$(cygpath -u "$SYSTEMROOT")/System32:$(cygpath -u "$SYSTEMROOT")" \
            target/debug/lumenwall.exe --version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ffmpeg-test-clips
          path: ${{ runner.temp }}/clips
      # Software decoding (WARP has no video decoder) of each format, with the build's
      # DLLs: H.264 and HEVC in MP4, HEVC Main 10 in Matroska, VP9 and VP8 in WebM.
      - name: Decode the generated clips on WARP
        env:
          WGPU_BACKEND: dx12
          LUMENWALL_FFMPEG_LOG: warning
        run: |
          cargo build -p lumenwall-video --locked --features ffmpeg --example video_png
          for clip in "$RUNNER_TEMP"/clips/*; do
            target/debug/examples/video_png.exe --times 0,1.5 --out "$RUNNER_TEMP/shots" "$clip"
          done
          ls -l "$RUNNER_TEMP/shots"
          test "$(ls "$RUNNER_TEMP/shots" | wc -l)" -eq 10

  release:
    name: release build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Check out with LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - run: cargo build --workspace --release --locked
      # Private artifact (repository members only) for manual testing on a real desktop.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lumenwall-${{ runner.os }}-${{ github.sha }}
          path: |
            target/release/lumenwall
            target/release/lumenwall.exe
          if-no-files-found: error
          retention-days: 7
