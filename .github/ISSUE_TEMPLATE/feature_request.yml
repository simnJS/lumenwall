name: Feature request
description: Something Lumen should do, or a Wallpaper Engine feature it does not support yet.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you want to do
      description: The situation and what is missing today. One request per issue.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you imagine it working (command-line option, setting, app behaviour).
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Wallpaper Engine compatibility (scene, particles, scripts, video, web…)
        - Desktop integration (Wayland, X11, Windows, pause, multi-screen)
        - Desktop app or tray
        - Performance
        - Packaging and installation
        - Other
    validations:
      required: true
  - type: textarea
    id: reference
    attributes:
      label: Wallpaper Engine reference
      description: |
        For compatibility requests: the public Wallpaper Engine documentation page (docs.wallpaperengine.io) or the Workshop ID of a wallpaper that needs the feature.
        Please do not paste code from other Wallpaper Engine reimplementations: Lumen is a clean-room project (see CLEANROOM.md).
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: help
    attributes:
      label: Would you help?
      options:
        - I can test on my machine
        - I can try to implement it
        - Not right now
