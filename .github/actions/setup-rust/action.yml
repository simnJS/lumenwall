name: Set up Rust build
description: >-
  Installs the toolchain declared in rust-toolchain.toml, the Linux development
  libraries the workspace links against, optionally a software Vulkan driver and
  (Windows) FFmpeg, and the cargo cache. Requires a prior actions/checkout.

inputs:
  system-deps:
    description: Install the Linux development packages (no effect on Windows).
    default: "true"
  software-gpu:
    description: >-
      Install the Vulkan loader and Mesa lavapipe on Linux for headless GPU tests.
      Windows needs nothing: the WARP software adapter ships with the OS.
    default: "false"
  cache:
    description: Restore and save target/ and ~/.cargo with Swatinem/rust-cache.
    default: "true"
  ffmpeg:
    description: >-
      Windows: download FFmpeg 8 (LGPL shared build, pinned by SHA-256), set FFMPEG_DIR
      (headers and import libraries for ffmpeg-sys-next) and put its DLLs on PATH, for
      builds with the lumenwall-engine/video-ffmpeg feature. No effect on Linux, where the
      system packages are used.
    default: "false"

runs:
  using: composite
  steps:
    - name: Install Rust toolchain (rust-toolchain.toml)
      shell: bash
      run: |
        rustup --version
        # No argument: installs or updates the toolchain pinned by rust-toolchain.toml,
        # with its components and targets (rustup >= 1.28).
        rustup toolchain install --no-self-update
        rustc --version --verbose
        cargo --version

    - name: Install Linux development libraries
      if: runner.os == 'Linux' && inputs.system-deps == 'true'
      shell: bash
      env:
        SOFTWARE_GPU: ${{ inputs.software-gpu }}
      run: |
        packages=(
          # Build tooling: pkg-config for *-sys crates, libclang for bindgen
          # (pipewire-sys, libspa-sys, ffmpeg-sys-next).
          pkg-config clang libclang-dev
          # Wayland (smithay-client-toolkit, layer-shell) and keyboard maps.
          libwayland-dev wayland-protocols libxkbcommon-dev
          # X11 / XCB (x11rb, winit windowed mode).
          libx11-dev libx11-xcb-dev libxcb1-dev libxkbcommon-x11-dev
          libxcursor-dev libxrandr-dev libxi-dev
          # Audio: ALSA (cpal playback), PipeWire, PulseAudio.
          libasound2-dev libpipewire-0.3-dev libspa-0.2-dev libpulse-dev
          # Video: FFmpeg (ffmpeg-next), VA-API and DRM for zero-copy dmabuf import.
          libavcodec-dev libavformat-dev libavutil-dev libavfilter-dev
          libavdevice-dev libswscale-dev libswresample-dev libva-dev libdrm-dev
        )
        if [[ "$SOFTWARE_GPU" == "true" ]]; then
          # Vulkan loader + Mesa lavapipe (CPU Vulkan driver) + vulkaninfo.
          packages+=(libvulkan1 mesa-vulkan-drivers vulkan-tools)
        fi
        sudo apt-get update -q
        sudo apt-get install -y -q --no-install-recommends "${packages[@]}"

    # Same build as for local development (crates/lumenwall-video/README.md): BtbN's
    # FFmpeg-Builds, release branch 8.1, "lgpl-shared" variant (never GPL, never static).
    # Month-end autobuilds are kept two years. bindgen finds libclang in the runner's LLVM.
    - name: Install FFmpeg 8 (LGPL shared build)
      if: runner.os == 'Windows' && inputs.ffmpeg == 'true'
      shell: pwsh
      env:
        FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-31-12-59/ffmpeg-n8.1.3-27-g8dca1586f4-win64-lgpl-shared-8.1.zip
        FFMPEG_SHA256: 5cef7bc48e513f3cee7c881e8b2999d835541edb1846c3e89443a67f8f8556ab
      run: |
        $ErrorActionPreference = 'Stop'
        $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
        Invoke-WebRequest -Uri $env:FFMPEG_URL -OutFile $zip
        $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
        if ($hash -ne $env:FFMPEG_SHA256) {
          throw "FFmpeg archive SHA-256 is $hash, expected $env:FFMPEG_SHA256"
        }
        $dest = Join-Path $env:RUNNER_TEMP 'ffmpeg'
        New-Item -ItemType Directory -Force $dest | Out-Null
        # bsdtar of System32 reads zip archives.
        & "$env:SystemRoot\System32\tar.exe" -xf $zip -C $dest
        if ($LASTEXITCODE -ne 0) { throw "cannot extract $zip" }
        $root = (Get-ChildItem $dest -Directory | Select-Object -First 1).FullName
        "FFMPEG_DIR=$root" >> $env:GITHUB_ENV
        (Join-Path $root 'bin') >> $env:GITHUB_PATH
        $llvm = 'C:\Program Files\LLVM\bin'
        if (-not $env:LIBCLANG_PATH -and (Test-Path (Join-Path $llvm 'libclang.dll'))) {
          "LIBCLANG_PATH=$llvm" >> $env:GITHUB_ENV
        }
        Get-ChildItem (Join-Path $root 'bin') -Filter *.dll | ForEach-Object { $_.Name }

    - name: Cargo cache
      if: inputs.cache == 'true'
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        # Only main writes the cache; pull requests restore it without evicting it.
        save-if: ${{ github.ref == 'refs/heads/main' }}
