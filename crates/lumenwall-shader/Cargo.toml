[package]
name = "lumenwall-shader"
description = "Translation of wallpaper shaders to GPU-ready modules."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Same major as wgpu 30. `wgsl-in` is only here because naga 30.0.1 does not
# build with `glsl-in` alone (the interpolation helper is gated on wgsl-in /
# spv-in); wgpu enables it by default anyway, so it costs nothing in the app.
naga = { version = "30.0.0", features = ["glsl-in", "wgsl-in", "serialize", "deserialize"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
blake3 = "1.8"
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
rayon = "1.10"
# Only for `--features render-contract`: tests then check the binding contract
# with the renderer's own reflection and create the wgpu modules on a device.
lumenwall-render = { workspace = true, optional = true }

[features]
render-contract = ["dep:lumenwall-render"]

[dev-dependencies]
# Back-ends used by wgpu (Vulkan, DX12), to check that generated modules are accepted.
naga = { version = "30.0.0", features = ["spv-out", "hlsl-out"] }

[lints]
workspace = true
