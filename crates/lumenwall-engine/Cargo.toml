[package]
name = "lumenwall-engine"
description = "Integration layer: assets, scene model, shaders, renderer, particles, audio and platform wired into one wallpaper engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["we-shaders"]
# Real Wallpaper Engine shaders through lumenwall-shader. Without it every WE shader is replaced by a
# WGSL passthrough that follows the lumenwall-render binding contract (logged once per shader).
we-shaders = ["dep:lumenwall-shader"]
# FFmpeg video decoding on platforms where it is not enabled automatically. Windows: off by
# default because building it needs an FFmpeg 8 shared build's headers and import libraries
# (`FFMPEG_DIR`) and libclang; release builds turn it on. The executable does not import the
# DLLs: they are loaded at the first video, from its folder (then PATH), see lumenwall-video's
# README. Always on for Linux.
video-ffmpeg = ["lumenwall-video/ffmpeg"]

[dependencies]
lumenwall-formats.workspace = true
lumenwall-assets.workspace = true
lumenwall-scene.workspace = true
lumenwall-render.workspace = true
lumenwall-particles.workspace = true
lumenwall-platform.workspace = true
lumenwall-audio.workspace = true
lumenwall-script.workspace = true
lumenwall-video.workspace = true
# Web wallpapers: the host process, its protocol and the Wallpaper Engine web API state (no
# browser in this process; the `cef` feature only builds the separate host executable).
lumenwall-web.workspace = true
lumenwall-shader = { workspace = true, optional = true }
# Same versions as lumenwall-render: only used for command encoders and surfaces it hands out.
# `vulkan`: DMA-BUF import of web frames through wgpu-hal (already enabled by lumenwall-render).
wgpu = { version = "30.0.1", default-features = false, features = ["std", "vulkan"] }
glam.workspace = true
# Text objects: shaping (harfrust), layout and glyph rasterisation (swash), MIT OR Apache-2.0.
# No `fontconfig`: the font database starts empty and only receives the fonts a wallpaper uses.
cosmic-text = { version = "0.15", default-features = false, features = ["std", "swash"] }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# PulseAudio-protocol capture and automute (also served by pipewire-pulse). libpulse is loaded
# at run time; without a sound server the spectrum stays at zero.
lumenwall-audio = { workspace = true, features = ["pulse"] }
# Video wallpapers: FFmpeg shared libraries (libavcodec/libavformat/libavutil/libswscale).
lumenwall-video = { workspace = true, features = ["ffmpeg"] }

[dev-dependencies]
tracing-subscriber.workspace = true
png = "0.18"

[[example]]
name = "render_png"

[lints]
workspace = true
