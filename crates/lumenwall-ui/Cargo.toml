[package]
name = "lumenwall-ui"
description = "Desktop application to browse, apply and configure wallpapers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

build = "build.rs"

[[bin]]
name = "lumenwall-ui"
path = "src/main.rs"

[dependencies]
lumenwall-ipc.workspace = true
# Signed self-update from GitHub Releases (src/updater.rs). A path dependency: the
# workspace manifest is left to the maintainers.
lumenwall-update.workspace = true
# Native Rust UI (no webview). wgpu with tiny-skia (CPU) as automatic fallback;
# smol executor: one runtime thread instead of a thread pool per core.
iced = { version = "0.14.0", default-features = false, features = ["wgpu-bare", "tiny-skia", "image-without-codecs", "svg", "smol", "x11", "wayland", "linux-theme-detection", "advanced", "crisp"] }
# iced 0.14 is built on wgpu 27 (the engine uses wgpu 30: two copies until iced
# moves on). Only Vulkan (and DX12 on Windows): no OpenGL driver gets loaded.
wgpu = { version = "27.0", default-features = false, features = ["std", "wgsl", "vulkan"] }
image.workspace = true
lz4_flex = { workspace = true, features = ["alloc", "safe-encode"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dirs = "7.0.0"
sys-locale = "0.3.2"
# Steam Workshop browsing (public Steam Web API) and preview downloads.
# rustls with the ring provider and the OS certificate store (no bundled roots).
ureq = { version = "3.5.1", default-features = false, features = ["rustls-no-provider", "platform-verifier", "gzip"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
# New Workshop subscriptions are noticed through file-system events (inotify,
# ReadDirectoryChangesW), never by polling.
notify = { version = "8.2.1", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
# Tray icon (StatusNotifierItem) and the file chooser portal, both over D-Bus.
zbus = "5.19"

[target.'cfg(windows)'.dependencies]
wgpu = { version = "27.0", default-features = false, features = ["dx12"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }
tray-icon = { version = "0.26", default-features = false }
rfd = { version = "0.16", default-features = false }

[build-dependencies]
# Windows: compiles the app icon and version resource (`lumenwall.ico`) into the
# executable with the platform's resource compiler (rc.exe, or MinGW windres
# when cross-compiling).
embed-resource = "3.0.11"

[lints]
workspace = true
