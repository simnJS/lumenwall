[package]
name = "lumenwall-formats"
description = "Readers for .pkg archives and .tex textures."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
tracing.workspace = true
serde_json.workspace = true
lz4_flex.workspace = true
# png/jpeg/gif/bmp/tga/webp come from the workspace; hdr and pnm complete the set
# of embedded-image formats the spec requires (spec 01 §2.6).
image = { workspace = true, features = ["hdr", "pnm"] }
memmap2 = "0.9.12"
bcdec_rs = "0.2.1"

[dev-dependencies]
# `block::compress` (bench inputs) needs `alloc`; the library only decompresses.
lz4_flex = { workspace = true, features = ["alloc"] }
# Hand-built PNG test images (zlib stream and chunk CRCs).
crc32fast = "1.5.0"
miniz_oxide = "0.8.9"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
tempfile = "3.27.0"
tracing-subscriber.workspace = true

[[bench]]
name = "formats"
harness = false

[lints]
workspace = true
