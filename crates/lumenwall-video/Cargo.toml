[package]
name = "lumenwall-video"
description = "Video wallpaper decoding to GPU textures."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[features]
# FFmpeg decoding (libavformat + libavcodec + libavutil + libswscale, shared libraries opened
# at the first video). Off by default so that a workspace build on a machine without the
# FFmpeg development files (a Windows machine without FFMPEG_DIR) still compiles;
# lumenwall-engine turns it on for Linux, Windows release builds with
# `--features lumenwall-engine/video-ffmpeg` (README). Without it, `VideoPlayer::open`
# returns `VideoError::Unsupported`.
ffmpeg = ["dep:ffmpeg-sys-next", "dep:libc", "dep:ash"]

[dependencies]
lumenwall-render.workspace = true
wgpu = { version = "30.0.1", default-features = false, features = ["std", "vulkan"] }
thiserror.workspace = true
tracing.workspace = true
memmap2 = "0.9.12"
# Raw FFmpeg 8 bindings (WTFPL, see deny.toml), generated by bindgen from the installed
# headers. Only avcodec/avformat/avutil/swscale are linked: no libavdevice/libavfilter (and
# their dependency trees) at run time. `static`/`build` are banned by deny.toml.
ffmpeg-sys-next = { version = "8.1.0", optional = true, default-features = false, features = ["avcodec", "avformat", "swscale"] }
libc = { version = "0.2", optional = true }
# Raw Vulkan for zero-copy decoding on wgpu's device (same version as wgpu-hal).
ash = { version = "0.38.0", optional = true }

# Direct3D 11 zero-copy decoding: FFmpeg's D3D11VA decoder on the renderer's own device
# (`d3d11` module, README "Direct3D 11"). Windows only; the Vulkan paths do not use it.
[target.'cfg(windows)'.dependencies]
lumenwall-d3d11 = { path = "../lumenwall-d3d11" }

[dev-dependencies]
tracing-subscriber.workspace = true

[lints]
workspace = true

[[example]]
name = "video_png"
required-features = ["ffmpeg"]
