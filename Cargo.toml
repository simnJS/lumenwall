[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
lumenwall-formats = { path = "crates/lumenwall-formats" }
lumenwall-scene = { path = "crates/lumenwall-scene" }
lumenwall-shader = { path = "crates/lumenwall-shader" }
lumenwall-render = { path = "crates/lumenwall-render" }
lumenwall-platform = { path = "crates/lumenwall-platform" }
lumenwall-audio = { path = "crates/lumenwall-audio" }
lumenwall-video = { path = "crates/lumenwall-video" }
lumenwall-script = { path = "crates/lumenwall-script" }
lumenwall-web = { path = "crates/lumenwall-web" }
lumenwall-particles = { path = "crates/lumenwall-particles" }
lumenwall-assets = { path = "crates/lumenwall-assets" }
lumenwall-ipc = { path = "crates/lumenwall-ipc" }
lumenwall-ui = { path = "crates/lumenwall-ui" }
lumenwall-engine = { path = "crates/lumenwall-engine" }

thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lz4_flex = { version = "0.14", default-features = false, features = ["safe-decode"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tga", "webp"] }
glam = "0.30"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
opt-level = 3

[profile.dev.package."*"]
opt-level = 2
