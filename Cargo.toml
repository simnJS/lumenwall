[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
lumen-formats = { path = "crates/lumen-formats" }
lumen-scene = { path = "crates/lumen-scene" }
lumen-shader = { path = "crates/lumen-shader" }
lumen-render = { path = "crates/lumen-render" }
lumen-platform = { path = "crates/lumen-platform" }
lumen-audio = { path = "crates/lumen-audio" }
lumen-video = { path = "crates/lumen-video" }
lumen-script = { path = "crates/lumen-script" }
lumen-web = { path = "crates/lumen-web" }
lumen-particles = { path = "crates/lumen-particles" }
lumen-assets = { path = "crates/lumen-assets" }

thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lz4_flex = { version = "0.11", default-features = false, features = ["safe-decode"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tga", "webp"] }
glam = "0.30"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
opt-level = 3

[profile.dev.package."*"]
opt-level = 2
