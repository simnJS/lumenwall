# Files of the Windows release that Cargo does not build, and what they are.
#
# package.py copies exactly these files into the zip (and Lumenwall-Setup.exe, made from
# it), writes their notices into THIRD-PARTY-NOTICES.html, then checks the zip holds
# exactly the expected files; the release workflow repeats that check before publishing
# (`package.py --check <zip>`). docs/RELEASING.md.
#
# Recipes: packaging/ffmpeg/README.md and crates/lumenwall-video/README.md ("Windows
# distribution") for FFmpeg, crates/lumenwall-web/README.md ("Windows runtime files") for
# CEF. Bump [ffmpeg] with the pins of packaging/ffmpeg/build.sh, [cef] with the `cef` crate
# of crates/lumenwall-web/Cargo.toml: package.py refuses a build that does not match.

[ffmpeg]
# Lumenwall's own minimal build (packaging/ffmpeg/build.sh): FFmpeg's release tarball,
# unmodified, with only the demuxers, decoders and hardware decoders of a video wallpaper;
# LGPL only (--enable-version3, never --enable-gpl or --enable-nonfree), no external
# library. Built by the `ffmpeg` job of ci.yml and release.yml (mingw-w64 on
# ubuntu-24.04). The DLLs are loaded by name at run time by lumenwall.exe, never linked
# statically. package.py checks the build's BUILD-INFO.txt against these values.
version = "8.1.3"
licence = "LGPL-3.0-or-later"
# Corresponding source: the release tarball (build.sh checks its SHA-256) and the script
# that configures and builds it, at the release's tag ({version}: Lumenwall's version).
source = "https://ffmpeg.org/releases/ffmpeg-8.1.3.tar.xz"
sha256 = "7138d28c96d9d3e3af4ee3d8cad72741f8ffb40da90c1112235dea3ecd3178a3"
build-script = "https://github.com/simnJS/lumenwall/blob/v{version}/packaging/ffmpeg/build.sh"
# From the build's bin\, next to lumenwall.exe (≈ 13 MiB; swresample is needed by avcodec).
dlls = ["avutil-60.dll", "swresample-6.dll", "swscale-9.dll", "avcodec-62.dll", "avformat-62.dll"]
# The build's BUILD-INFO.txt (sources and SHA-256, configure line, toolchain), shipped as:
build-info = "licenses/FFmpeg-BUILD-INFO.txt"

# Licences of what is compiled into the DLLs, written by build.sh into the build's
# licenses\ and shipped under the same names.
[ffmpeg.licences]
# FFmpeg: the LGPL-3.0 (COPYING.LGPLv3), and the GPL-3.0 it incorporates (COPYING.GPLv3).
lgpl = "licenses/FFmpeg-LGPL-3.0.txt"
gpl = "licenses/GPL-3.0.txt"
# NVIDIA's codec headers as packaged by FFmpeg (MIT): CUDA and NVDEC.
nv-codec-headers = "licenses/nv-codec-headers.txt"
# Khronos' Vulkan headers (Apache-2.0, some files also MIT): Vulkan Video.
vulkan-headers = "licenses/Vulkan-Headers.txt"
# The MinGW-w64 runtime linked statically into each DLL (the toolchain's own licence file).
mingw-w64 = "licenses/MinGW-w64.txt"

[cef]
# The `cef` crate's distribution (CEF_PATH/<version>/cef_windows_x86_64): CEF 156.0.15,
# windows64 "minimal", downloaded from the official CEF builds at build time.
version = "156.0.15+gcf671c0+chromium-156.0.8078.80"
archive = "cef_binary_156.0.15+gcf671c0+chromium-156.0.8078.80_windows64_minimal.tar.bz2"
binaries = "https://cef-builds.spotifycdn.com/cef_binary_156.0.15%2Bgcf671c0%2Bchromium-156.0.8078.80_windows64_minimal.tar.bz2"
source = "https://github.com/chromiumembedded/cef/tree/cf671c072925b27823a61181152f4f288e8e4306"
chromium-source = "https://chromium.googlesource.com/chromium/src/+/refs/tags/156.0.8078.80"
# Next to lumenwall-web-host.exe. Required: the host does not start without them.
required = [
    "libcef.dll",
    "chrome_elf.dll",
    "icudtl.dat",
    "v8_context_snapshot.bin",
    "resources.pak",
    "chrome_100_percent.pak",
    "chrome_200_percent.pak",
]
# Recommended: WebGL on D3D11 (ANGLE's HLSL compiler) and software rendering when the
# GPU is unusable or blocklisted (SwiftShader).
recommended = ["d3dcompiler_47.dll", "vk_swiftshader.dll", "vk_swiftshader_icd.json", "vulkan-1.dll"]
# Every UI locale (parity with Wallpaper Engine: the page's navigator.language follows
# the locale Chromium loads), en-US.pak at least.
locales = 220
# Never shipped: WebGPU on D3D12 only (dxcompiler.dll, 24.8 MiB), the sandbox
# bootstrap (the sandbox is off), build-time files.
never = [
    "dxcompiler.dll",
    "bootstrap.exe",
    "bootstrapc.exe",
    "libcef.lib",
    "CMakeLists.txt",
    "archive.json",
    "cmake",
    "include",
    "libcef_dll",
]
# CEF's own licence (BSD-3-Clause, LICENSE.txt of the distribution archive, which the
# `cef` crate keeps next to the extracted folder) and Chromium's CREDITS.html (licences
# of Chromium and of the third-party code in libcef.dll), shipped as:
licence-file = "licenses/CEF-LICENSE.txt"
credits-file = "licenses/Chromium-CREDITS.html"
